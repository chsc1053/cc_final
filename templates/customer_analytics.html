{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">Customer Analytics</h1>

    <!-- Customer Segmentation Section -->
    <div class="card mb-4">
        <div class="card-header">
            <h2>Customer Segmentation</h2>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6">
                    <h3>By Income Range</h3>
                    <canvas id="incomeSegmentation"></canvas>
                </div>
                <div class="col-md-6">
                    <h3>By Household Size</h3>
                    <canvas id="householdSizeSegmentation"></canvas>
                </div>
            </div>
            <div class="row mt-4">
                <div class="col-md-6">
                    <h3>By Age Range</h3>
                    <canvas id="ageSegmentation"></canvas>
                </div>
                <div class="col-md-6">
                    <h3>By Loyalty Status</h3>
                    <canvas id="loyaltySegmentation"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- Purchase Behavior Section -->
    <div class="card mb-4">
        <div class="card-header">
            <h2>Purchase Behavior Analysis</h2>
        </div>
        <div class="card-body">
            <div class="row mt-4">
                <div class="col-md-12">
                    <h3>Top Product Categories</h3>
                    <canvas id="topCategories"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    // Function to create charts
    function createChart(canvasId, data) {
        const ctx = document.getElementById(canvasId).getContext('2d');
        new Chart(ctx, data);
    }

    // Load data from the server
    fetch('/customer_analytics_data')
        .then(response => response.json())
        .then(data => {
            // Create segmentation charts
            createChart('incomeSegmentation', data.incomeSegmentation);
            createChart('householdSizeSegmentation', data.householdSizeSegmentation);
            createChart('ageSegmentation', data.ageSegmentation);
            createChart('loyaltySegmentation', data.loyaltySegmentation);

            // Create purchase behavior charts
            createChart('topCategories', data.topCategories);
        })
        .catch(error => console.error('Error loading analytics data:', error));
</script>
{% endblock %}
