{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">Product Analytics</h1>

    <!-- Product Performance Section -->
    <div class="card mb-4">
        <div class="card-header">
            <h2>Product Performance</h2>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6">
                    <h3>Top Selling Products</h3>
                    <canvas id="topProducts"></canvas>
                </div>
                <div class="col-md-6">
                    <h3>Revenue by Product</h3>
                    <canvas id="revenueByProduct"></canvas>
                </div>
            </div>
            <div class="row mt-4">
                <div class="col-md-12">
                    <h3>Product Sales Trend</h3>
                    <canvas id="salesTrend"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- Category Analysis Section -->
    <div class="card mb-4">
        <div class="card-header">
            <h2>Category Analysis</h2>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6">
                    <h3>Sales by Department</h3>
                    <canvas id="salesByDepartment"></canvas>
                </div>
                <div class="col-md-6">
                    <h3>Top Commodities</h3>
                    <canvas id="topCommodities"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- Brand Analysis Section -->
    <div class="card mb-4">
        <div class="card-header">
            <h2>Brand Analysis</h2>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6">
                    <h3>Brand Type Distribution</h3>
                    <canvas id="brandTypeDistribution"></canvas>
                </div>
                <div class="col-md-6">
                    <h3>Organic vs Non-Organic</h3>
                    <canvas id="organicDistribution"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    // Function to create charts
    function createChart(canvasId, data) {
        const ctx = document.getElementById(canvasId).getContext('2d');
        new Chart(ctx, data);
    }

    // Load data from the server
    fetch('/product_analytics_data')
        .then(response => response.json())
        .then(data => {
            // Create product performance charts
            createChart('topProducts', data.topProducts);
            createChart('revenueByProduct', data.revenueByProduct);
            createChart('salesTrend', data.salesTrend);

            // Create category analysis charts
            createChart('salesByDepartment', data.salesByDepartment);
            createChart('topCommodities', data.topCommodities);

            // Create brand analysis charts
            createChart('brandTypeDistribution', data.brandTypeDistribution);
            createChart('organicDistribution', data.organicDistribution);
        })
        .catch(error => console.error('Error loading analytics data:', error));
</script>
{% endblock %}
